# Portal Scanner Configuration
# Tailored for: Gishnu Madhu
# Focus: Applied AI Engineer / AI Platform Engineer / Backend AI Systems / Agentic & Voice AI / ML Infrastructure

title_filter:
  positive:
    # Core AI engineering
    - "AI Engineer"
    - "Applied AI Engineer"
    - "ML Engineer"
    - "Machine Learning Engineer"
    - "LLM Engineer"
    - "Generative AI Engineer"
    - "GenAI Engineer"
    - "Agent Engineer"
    - "Agentic Engineer"
    - "AI Platform Engineer"
    - "ML Platform Engineer"
    - "MLOps Engineer"
    - "LLMOps Engineer"
    - "AI Infrastructure Engineer"
    - "AI Systems Engineer"

    # Backend / distributed / infra fit
    - "Backend Engineer"
    - "Software Engineer"
    - "Platform Engineer"
    - "Distributed Systems Engineer"
    - "Infrastructure Engineer"

    # Workflow / orchestration / deployment
    - "Forward Deployed Engineer"
    - "Deployment Engineer"
    - "Solutions Engineer"
    - "Solutions Architect"

    # Voice / conversational / search / retrieval
    - "Voice AI"
    - "Speech AI"
    - "Conversational AI"
    - "RAG Engineer"
    - "Research Engineer"

  negative:
    # Low-fit or distracting roles
    - "Junior"
    - "Intern"
    - "Product Manager"
    - "Product Owner"
    - "Designer"
    - "Sales"
    - "Account Executive"
    - "Customer Success"
    - "Recruiter"
    - "Marketing"
    - "DevRel"
    - "Developer Advocate"
    - "QA"
    - "SDET"
    - ".NET"
    - "PHP"
    - "Ruby"
    - "iOS"
    - "Android"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Salesforce Admin"
    - "SAP"
    - "Oracle EBS"
    - "Mainframe"
    - "COBOL"

  seniority_boost:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"

search_queries:
  # Greenhouse
  - name: Greenhouse — Applied AI / LLM
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Applied AI Engineer" OR "LLM Engineer" OR "Generative AI Engineer" remote'
    enabled: true

  - name: Greenhouse — ML Platform / MLOps
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "ML Platform Engineer" OR "MLOps Engineer" OR "LLMOps Engineer" remote'
    enabled: true

  - name: Greenhouse — Backend AI / Systems
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Backend Engineer" OR "Platform Engineer" "AI" OR "LLM" remote'
    enabled: true

  - name: Greenhouse — Agentic / RAG / Search
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Agentic" OR "AI Agent" OR "RAG" OR "Research Engineer" remote'
    enabled: true

  - name: Greenhouse — Voice AI / Conversational AI
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Voice AI" OR "Speech" OR "Conversational AI" "Engineer" remote'
    enabled: true

  - name: Greenhouse — Forward Deployed / Solutions
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Forward Deployed Engineer" OR "Deployment Engineer" OR "Solutions Engineer" AI remote'
    enabled: true

  # Ashby
  - name: Ashby — Applied AI / LLM
    query: 'site:jobs.ashbyhq.com "Applied AI Engineer" OR "LLM Engineer" OR "AI Engineer" remote'
    enabled: true

  - name: Ashby — Platform / Backend AI
