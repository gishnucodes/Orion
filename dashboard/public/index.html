<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Job Scanner Dashboard</title>
  <style>
    :root {
      --bg: #0f1216;
      --panel: #151a20;
      --text: #e6edf3;
      --muted: #9aa4ad;
      --accent: #79c0ff;
      --bad: #ff7b72;
      --good: #7ee787;
      --border: #232a32;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Space Grotesk", system-ui, sans-serif;
      background: radial-gradient(circle at 20% 20%, #1b2430, #0f1216 60%);
      color: var(--text);
    }
    header {
      padding: 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(15,18,22,0.9);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 22px;
      letter-spacing: 0.4px;
    }
    .filters {
      display: grid;
      grid-template-columns: 120px 140px 1fr 1fr 120px;
      gap: 12px;
      align-items: center;
    }
    input, select {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 14px;
    }
    main {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
      padding: 16px 24px 40px 24px;
    }
    .table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .table th, .table td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      font-size: 13px;
    }
    .table th {
      color: var(--muted);
      font-weight: 600;
    }
    .table tr:hover {
      background: rgba(121,192,255,0.08);
      cursor: pointer;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid var(--border);
    }
    .badge.good { color: var(--good); border-color: rgba(126,231,135,0.4); }
    .badge.bad { color: var(--bad); border-color: rgba(255,123,114,0.4); }
    .side {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      height: fit-content;
      position: sticky;
      top: 110px;
    }
    .side h2 { margin: 0 0 8px 0; font-size: 16px; }
    .muted { color: var(--muted); }
    .reason { margin: 6px 0; font-size: 13px; }
    .link {
      color: var(--accent);
      text-decoration: none;
      word-break: break-all;
    }
    .section { margin-top: 12px; }
    pre {
      background: #0b0e12;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      overflow: auto;
      max-height: 320px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Job Scanner Dashboard</h1>
    <div class="filters">
      <select id="matched">
        <option value="all">All</option>
        <option value="1">Matched</option>
        <option value="0">Not matched</option>
      </select>
      <input id="minScore" type="number" step="0.1" min="0" max="5" placeholder="Min score" />
      <input id="company" type="text" placeholder="Company" />
      <input id="title" type="text" placeholder="Title" />
      <button id="refresh">Refresh</button>
    </div>
    <div id="status" class="muted" style="margin-top:8px;font-size:12px;"></div>
  </header>
  <main>
    <div>
      <table class="table" id="jobsTable">
        <thead>
          <tr>
            <th>Score</th>
            <th>Match</th>
            <th>Company</th>
            <th>Title</th>
            <th>Location</th>
            <th>Reasons</th>
            <th>Apply</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <aside class="side" id="detailPane">
      <h2>Job Details</h2>
      <div class="muted">Select a row to see details.</div>
    </aside>
  </main>

  <script>
    const tableBody = document.querySelector('#jobsTable tbody');
    const detailPane = document.getElementById('detailPane');

    async function fetchJobs() {
      const matched = document.getElementById('matched').value;
      const minScore = document.getElementById('minScore').value;
      const company = document.getElementById('company').value;
      const title = document.getElementById('title').value;

      const params = new URLSearchParams();
      if (matched !== 'all') params.set('matched', matched);
      if (minScore) params.set('min_score', minScore);
      if (company) params.set('company', company);
      if (title) params.set('title', title);

      const res = await fetch(`/api/jobs?${params.toString()}`);
      const data = await res.json();
      const status = document.getElementById('status');
      status.textContent = `Showing ${data.count || 0} jobs${params.toString() ? ` | filters: ${params.toString()}` : ''}`;
      renderTable(data.jobs || []);
    }

    function renderTable(jobs) {
      tableBody.innerHTML = '';
      if (jobs.length === 0) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 7;
        td.textContent = 'No jobs match the current filters.';
        td.className = 'muted';
        tr.appendChild(td);
        tableBody.appendChild(tr);
        return;
      }
      for (const job of jobs) {
        const tr = document.createElement('tr');
        tr.addEventListener('click', () => loadDetail(job.id));

        const score = document.createElement('td');
        score.textContent = job.score?.toFixed(1) ?? '0.0';

        const match = document.createElement('td');
        const badge = document.createElement('span');
        badge.className = `badge ${job.matched ? 'good' : 'bad'}`;
        badge.textContent = job.matched ? 'Yes' : 'No';
        match.appendChild(badge);

        const company = document.createElement('td');
        company.textContent = job.company || '-';

        const title = document.createElement('td');
        title.textContent = job.title || '-';

        const location = document.createElement('td');
        location.textContent = job.location || '-';

        const reasons = document.createElement('td');
        reasons.textContent = (job.reasons || []).join('; ');

        const link = document.createElement('td');
        const a = document.createElement('a');
        a.href = job.url;
        a.className = 'link';
        a.target = '_blank';
        a.rel = 'noreferrer';
        a.textContent = 'Apply';
        link.appendChild(a);

        tr.append(score, match, company, title, location, reasons, link);
        tableBody.appendChild(tr);
      }
    }

    async function loadDetail(id) {
      const res = await fetch(`/api/job/${id}`);
      const job = await res.json();
      detailPane.innerHTML = `
        <h2>${job.title || 'Untitled'}</h2>
        <div class="section"><span class="muted">Company:</span> ${job.company || '-'}</div>
        <div class="section"><span class="muted">Score:</span> ${job.score?.toFixed(1) ?? '0.0'} ${job.matched ? '(Matched)' : '(Not matched)'}</div>
        <div class="section"><span class="muted">Location:</span> ${job.location || '-'}</div>
        <div class="section"><a class="link" href="${job.url}" target="_blank" rel="noreferrer">Open job link</a></div>
        <div class="section"><span class="muted">Reasons:</span>
          ${(job.reasons || []).map(r => `<div class="reason">- ${r}</div>`).join('') || '<div class="reason">- None</div>'}
        </div>
        <div class="section"><span class="muted">Breakdown</span><pre>${JSON.stringify(job.breakdown || {}, null, 2)}</pre></div>
        <div class="section"><span class="muted">Entity Graph</span><pre>${JSON.stringify(job.extraction?.entity_graph || {}, null, 2)}</pre></div>
      `;
    }

    function debounce(fn, wait = 300) {
      let t;
      return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...args), wait);
      };
    }

    const debouncedFetch = debounce(fetchJobs, 300);
    document.getElementById('refresh').addEventListener('click', fetchJobs);
    document.getElementById('matched').addEventListener('change', fetchJobs);
    document.getElementById('minScore').addEventListener('change', fetchJobs);
    document.getElementById('company').addEventListener('input', debouncedFetch);
    document.getElementById('title').addEventListener('input', debouncedFetch);
    fetchJobs();
  </script>
</body>
</html>
